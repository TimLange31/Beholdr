# Plain-manifest equivalent of the Terraform module, for `kubectl apply`.
# Replace IMAGE and the ingress host before applying.
apiVersion: v1
kind: Namespace
metadata:
  name: beholdr
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beholdr
  namespace: beholdr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: beholdr
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: beholdr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: beholdr
subjects:
  - kind: ServiceAccount
    name: beholdr
    namespace: beholdr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beholdr
  namespace: beholdr
  labels: { app.kubernetes.io/name: beholdr }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: beholdr }
  template:
    metadata:
      labels: { app.kubernetes.io/name: beholdr }
    spec:
      serviceAccountName: beholdr
      containers:
        - name: beholdr
          image: IMAGE  # <-- replace, e.g. registry.example.com/beholdr:0.1.0
          ports:
            - containerPort: 8000
          env:
            - { name: BEHOLDR_KUBE_MODE, value: "in-cluster" }
            - { name: BEHOLDR_POLL_INTERVAL, value: "15" }
            - { name: BEHOLDR_HISTORY_SIZE, value: "240" }
            - { name: BEHOLDR_NAMESPACES, value: "" }
            # No default: Beholdr exposes cluster topology, pod names, and
            # resource usage, so cross-origin access must be opted into
            # explicitly. Leave unset unless a separately-hosted frontend
            # needs to call this API cross-origin.
            - { name: BEHOLDR_CORS_ORIGINS, value: "" }
            # External systems are optional. Empty endpoints keep each
            # integration disabled until its platform component exists.
            - { name: BEHOLDR_PROMETHEUS_URL, value: "" }
            - { name: BEHOLDR_ELASTICSEARCH_URL, value: "" }
            - { name: BEHOLDR_OTEL_COLLECTOR_HEALTH_URL, value: "" }
            - { name: BEHOLDR_INTEGRATION_CHECK_INTERVAL, value: "30" }
            - { name: BEHOLDR_INTEGRATION_REQUEST_TIMEOUT, value: "5" }
            # Prometheus range/instant queries are real work, not a liveness
            # probe, so they get their own (much longer) timeout. Reusing the
            # 5s health-check timeout above makes the long windows fail.
            - { name: BEHOLDR_PROMETHEUS_QUERY_TIMEOUT, value: "30" }
            # Service-health reports are reused for this long and bounded to
            # this many concurrent queries. The UI polls per open browser tab
            # and each uncached report is ten or more Prometheus queries, so
            # these are what keep a busy incident from loading the Prometheus
            # you are debugging with.
            - { name: BEHOLDR_SERVICE_METRICS_CACHE_TTL, value: "30" }
            - { name: BEHOLDR_SERVICE_MAX_CONCURRENT_QUERIES, value: "6" }
            #
            # Service-health metric profile. Beholdr owns the PromQL; these
            # name the metrics and labels it selects on. Leave a value unset to
            # take Beholdr's default (shown in the comment). A value that is
            # set but unusable stops the pod at startup rather than being
            # silently replaced.
            #
            # ASP.NET Core (Beholdr's defaults):
            # - { name: BEHOLDR_SERVICE_HTTP_REQUESTS_METRIC, value: "aspnetcore_requests_duration_seconds_count" }
            # - { name: BEHOLDR_SERVICE_HTTP_STATUS_LABEL, value: "code" }
            # OpenTelemetry semantic conventions:
            # - { name: BEHOLDR_SERVICE_HTTP_REQUESTS_METRIC, value: "http_server_request_duration_seconds_count" }
            # - { name: BEHOLDR_SERVICE_HTTP_STATUS_LABEL, value: "http_response_status_code" }
            #
            # Label names depend on your Prometheus relabeling. The app labels
            # default to kubernetes_namespace / app_kubernetes_io_name; the
            # cAdvisor and kube-state-metrics labels to namespace / pod.
            # - { name: BEHOLDR_SERVICE_APP_NAMESPACE_LABEL, value: "kubernetes_namespace" }
            # - { name: BEHOLDR_SERVICE_APP_SERVICE_LABEL, value: "app_kubernetes_io_name" }
            # - { name: BEHOLDR_SERVICE_KUBE_NAMESPACE_LABEL, value: "namespace" }
            # - { name: BEHOLDR_SERVICE_KUBE_POD_LABEL, value: "pod" }
            #
            # CPU is scored against limits by default, where over 100% means
            # throttling. Switch to requests only with thresholds that suit it:
            # requests are a scheduling floor, and healthy bursty services sit
            # well above 100% of request.
            # - { name: BEHOLDR_SERVICE_CPU_BASIS, value: "requests" }
            # - { name: BEHOLDR_SERVICE_CPU_WARNING, value: "150" }
            # - { name: BEHOLDR_SERVICE_CPU_CRITICAL, value: "300" }
            # Add BEHOLDR_PROMETHEUS_BEARER_TOKEN and
            # BEHOLDR_ELASTICSEARCH_API_KEY with secretKeyRef entries when
            # authentication is required. Never put credentials in these URLs.
            #
            # Outbound TLS: when a backend presents a certificate the system
            # trust store does not know (an ECK-issued Elasticsearch cert, a
            # Cloudflare Origin CA cert, a corporate PKI), mount the CA bundle
            # and point at it. Uncomment the volume/volumeMount below too.
            # - { name: BEHOLDR_ELASTICSEARCH_CA_FILE, value: "/etc/beholdr/ca/elastic-ca.crt" }
            # - { name: BEHOLDR_PROMETHEUS_CA_FILE, value: "/etc/beholdr/ca/prometheus-ca.crt" }
            #
            # Last resort only, when the CA genuinely cannot be obtained: this
            # is logged at WARN on startup and the UI marks the provider
            # unverified. Prefer the CA bundle above.
            # - { name: BEHOLDR_ELASTICSEARCH_TLS_INSECURE, value: "true" }
          # volumeMounts:
          #   - { name: integration-ca, mountPath: /etc/beholdr/ca, readOnly: true }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          livenessProbe:
            # Liveness only proves the process can serve HTTP; it must not
            # depend on collector/cluster state.
            httpGet: { path: /live, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            # Readiness fails until the collector has completed a recent
            # successful poll, so the Service won't route traffic here
            # before there's real data (or once that data goes stale).
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
      # volumes:
      #   - name: integration-ca
      #     secret: { secretName: beholdr-integration-ca, defaultMode: 0444 }
---
apiVersion: v1
kind: Service
metadata:
  name: beholdr
  namespace: beholdr
  labels: { app.kubernetes.io/name: beholdr }
spec:
  selector: { app.kubernetes.io/name: beholdr }
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beholdr
  namespace: beholdr
  annotations:
    # TLS, option A — terminate in the cluster (the default below): request a
    # certificate from cert-manager, or point tls.secretName at a secret you
    # manage yourself (a Cloudflare Origin CA certificate belongs here too, for
    # Cloudflare Full / Full (strict)). Do not serve this over plain HTTP in
    # production — it exposes cluster topology, pod names, and resource usage.
    cert-manager.io/cluster-issuer: letsencrypt-prod  # <-- replace or remove if managing certs another way
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    #
    # TLS, option B — terminate at the edge (Cloudflare Flexible SSL, a
    # Cloudflare Tunnel, an external load balancer). The cluster then needs no
    # certificate or key: delete the cert-manager annotation and the whole
    # spec.tls block below, and swap the two redirect annotations above for
    # these. Switching the redirects off is not optional — the edge already
    # rewrites http to https, so an origin-side redirect bounces back to the
    # edge, which re-requests over http: ERR_TOO_MANY_REDIRECTS.
    #   nginx.ingress.kubernetes.io/ssl-redirect: "false"
    #   nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    # In that mode the origin answers plain HTTP, so restrict who can reach it;
    # otherwise anything that routes to this Ingress bypasses the edge and the
    # authentication in front of it. Current list: https://www.cloudflare.com/ips/
    #   nginx.ingress.kubernetes.io/whitelist-source-range: "173.245.48.0/20,103.21.244.0/22,..."
    # Authentication: Beholdr has no built-in login, so an OIDC-aware proxy
    # must sit in front of it. Example using oauth2-proxy as an
    # auth_request subrequest (https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#auth):
    nginx.ingress.kubernetes.io/auth-url: "https://oauth2-proxy.example.com/oauth2/auth"  # <-- replace with your OIDC proxy
    nginx.ingress.kubernetes.io/auth-signin: "https://oauth2-proxy.example.com/oauth2/start?rd=$scheme://$host$request_uri"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [beholdr.example.com]  # <-- replace, must match the host below
      secretName: beholdr-tls       # <-- cert-manager creates this, or supply your own
  rules:
    - host: beholdr.example.com  # <-- replace
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beholdr
                port: { number: 80 }
